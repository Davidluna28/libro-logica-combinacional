site_name: Lógica Combinacional · Libro de Aprendizaje
site_description: Libro de aprendizaje de cuatro semanas sobre análisis de lógica combinacional
docs_dir: docs
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-night, name: Modo oscuro }
    - scheme: slate
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-sunny, name: Modo claro }
  features: [navigation.tabs, navigation.top, content.code.copy]
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Portada: portada.md
  - Inicio: index.md
  - Semana 1 · Sistemas y compuertas: semana-1.md
  - Semana 2 · Álgebra de Boole: semana-2.md
  - Semana 3 · Karnaugh y NAND/NOR: semana-3.md
  - Semana 4 · Bloques aritméticos: semana-4.md
  - Glosario: glosario.md
